name: Build and Push Docker Images

on:
  push:
    branches: [ cinema ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REPO: ${{ github.event.repository.name }}
  REPO_LC: ${{ github.repository_owner }}/$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
  IMAGE_PROXY: ${{ github.repository }}/proxy
  IMAGE_EVENTS: ${{ github.repository }}/events
  IMAGE_MOVIES: ${{ github.repository }}/movies
  IMAGE_MONOLITH: ${{ github.repository }}/monolith
  TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Convert repo name to lowercase
        run: |
          echo "REPO_LC=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Сборка и пуш proxy ---
      - name: Build and push proxy image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          file: ./src/microservices/proxy/Dockerfile
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_LC }}/proxy:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_LC }}/proxy:latest

      # --- Сборка и пуш events ---
      - name: Build and push events image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          file: ./src/microservices/events/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_LC }}/events:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_LC }}/events:latest

      # --- Сборка и пуш movies ---
      - name: Build and push movies image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          file: ./src/microservices/movies/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_LC }}/movies:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_LC }}/movies:latest

      # --- Сборка и пуш movies ---
      - name: Build and push monolith image
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          file: ./src/monolith/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_LC }}/monolith:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_LC }}/monolith:latest

      # --- Запуск тестов ---
      - name: Run API tests
        run: |
          echo "Running API tests..."
          docker run --rm \
            -e API_URL=http://localhost:8080 \
            -v ${{ github.workspace }}/tests:/tests \
            node:18 bash -c "cd /tests && npm ci && npm test"