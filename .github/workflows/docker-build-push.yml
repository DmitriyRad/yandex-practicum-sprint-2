name: Build and Push Docker Images

on:
  push:
    branches: [ cinema ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  OWNER: dmitriyrad

  IMAGE_PROXY: ghcr.io/${{ github.repository_owner }}/proxy-service
  IMAGE_EVENTS: ghcr.io/${{ github.repository_owner }}/events-service
  IMAGE_MOVIES: ghcr.io/${{ github.repository_owner }}/movies-service
  IMAGE_MONOLITH: ghcr.io/${{ github.repository_owner }}/monolith-service

  TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Сборка и пуш proxy ---
      - name: Build and push proxy image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          file: ./src/microservices/proxy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PROXY }}:${{ env.TAG }}
            ${{ env.IMAGE_PROXY }}:latest

      # --- Сборка и пуш events ---
      - name: Build and push events image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          file: ./src/microservices/events/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_EVENTS }}:${{ env.TAG }}
            ${{ env.IMAGE_EVENTS }}:latest

      # --- Сборка и пуш movies ---
      - name: Build and push movies image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          file: ./src/microservices/movies/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_MOVIES }}:${{ env.TAG }}
            ${{ env.IMAGE_MOVIES }}:latest

      # --- Сборка и пуш monolith ---
      - name: Build and push monolith image
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          file: ./src/monolith/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_MONOLITH }}:${{ env.TAG }}
            ${{ env.IMAGE_MONOLITH }}:latest

      # --- Запуск тестов ---
      - name: Run API tests
        run: |
          chmod +x ./tests/postman/run-tests.sh
          ./tests/postman/run-tests.sh